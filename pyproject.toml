# The Nuclear Smart Graph is written in Nuclear (the `.nuc` files of this folder, `nuclear.toml`): this file only
# packages what `nuclear build .` writes in `build/nuclear_graph`. Build before installing or testing.
[project]
name = "nuclear-graph"
version = "0.2.0"
description = "Nuclear Smart Graph: the local, private knowledge base of NuclearLang and Dragonfly (shelves of cards and a table of exact facts), and their MCP server."
license = "Apache-2.0"
requires-python = ">=3.12"
# the client and the tools for agents need only httpx; the MCP server alone (remote agents only, ADR-0106) is the
# `mcp` extra; the graph's server, its store and the MCP server are the `server` extra
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
server = ["chromadb>=1.5", "numpy>=2", "ollama>=0.6", "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=44", "mcp>=2.3"]
test = ["pytest>=8"]

[project.scripts]
nuclear-graph = "nuclear_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `build/` is not kept in git (it is generated), but it is the package: without this the wheel would be empty
[tool.hatch.build]
artifacts = ["build/nuclear_graph/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["build/nuclear_graph"]
exclude = ["build/nuclear_graph/tests"]

# the prompt files travel inside the package (a checkout reads them from `prompts/`: `Paths.prompts`)
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "nuclear_graph/prompts"
# the generated code is annotated: a project that uses the package is type-checked against it
"py.typed" = "nuclear_graph/py.typed"

[tool.pytest.ini_options]
pythonpath = ["build"]
testpaths = ["build/nuclear_graph/tests"]

[tool.pyright]
typeCheckingMode = "standard"
# the package is what `nuclear build .` writes
extraPaths = ["build"]
exclude = [".venv"]
