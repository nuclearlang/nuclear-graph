[project]
name = "nuclear-graph"
version = "0.1.0"
description = "Nuclear Smart Graph: the local, private knowledge base (RAG) of NuclearLang and Dragonfly, and their MCP server."
license = "Apache-2.0"
requires-python = ">=3.12"
# the client and the tools for agents need only httpx; the graph's server, store and MCP are the `server` extra
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
server = ["chromadb>=1.5", "ollama>=0.6", "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=44", "mcp>=2.3"]
test = ["pytest>=8"]

[project.scripts]
nuclear-graph = "nuclear_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuclear_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
typeCheckingMode = "standard"
